name: ${COMPOSE_PROJECT_NAME:-yunsuo}

services:
  mysql:
    image: mysql:8.0
    container_name: yunsuo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Please copy .env.example to .env and set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: yunsuo
      MYSQL_USER: yunsuo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Please set MYSQL_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - yunsuo-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: yunsuo-backend
    restart: unless-stopped
    environment:
      PORT: 18180
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: yunsuo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Please set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: yunsuo
      JWT_SECRET: ${JWT_SECRET:?Please set JWT_SECRET in .env}
      COOKIE_SECRET: ${COOKIE_SECRET:?Please set COOKIE_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Please set ADMIN_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "18180"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18180/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build: ./frontend
    container_name: yunsuo-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18088}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  yunsuo-mysql:
